<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"></head><body>
<title>P1 CPD Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: P1 Investment Services working tool. White top bar, light grey workspace, white bordered panels.
   Black is the action colour (contrast), P1 red marks emphasis: current location, attention, required, key figures. Single light look. */
:root {
  --bg: #F4F4F5;          /* workspace */
  --surface: #FFFFFF;
  --surface-2: #FAFAFA;   /* table heads, quiet fills */
  --line: #E4E4E7;
  --line-strong: #D4D4D8;
  --ink: #111111;         /* near-black text and primary buttons */
  --ink-hover: #2B2B2B;
  --muted: #52525B;
  --faint: #71717A;
  --red: #EA4443;         /* P1 red: emphasis, never body text on white */
  --red-ink: #C42B2A;     /* red for small text and icons on white (AA) */
  --red-tint: #FDECEC;
  --ok: #15803D; --ok-tint: #ECF7EF;
  --warn: #B45309; --warn-tint: #FEF5E7;
  --err: #B42318; --err-tint: #FDEDEC;
  --info-tint: #F1F1F3;
  --s-ret: #52525B; --s-new: #EA4443; /* chart: returning (neutral), first time (red) */
  --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --r: 8px; --r-sm: 6px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--ink); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
.icon { width: 1em; height: 1em; fill: currentColor; flex: none; vertical-align: -0.125em; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
h1 { font-size: clamp(24px, 3vw, 30px); font-weight: 600; line-height: 1.2; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 18px; font-weight: 600; margin: 0; line-height: 1.3; }
h3 { font-size: 15px; font-weight: 600; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--surface); }
.topbar .wrap { display: flex; align-items: center; gap: 24px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none; }
.brand svg { width: 22px; height: 24px; }
.brand-name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.brand-name span { font-weight: 500; color: var(--muted); }
.nav { display: flex; gap: 4px; align-self: stretch; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.nav button { background: none; border: 0; padding: 0 12px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; position: relative; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); }
.nav button[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: var(--red); }
.nav .count { background: var(--red); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; line-height: 18px; min-width: 18px; text-align: center; }
.topbar-end { margin-left: auto; display: flex; gap: 8px; align-items: center; flex: none; }

/* adviser-only notice + preview banner */
.audience { background: var(--surface); border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.audience .wrap { padding-block: 7px; display: flex; align-items: center; gap: 8px; }
.audience i { width: 6px; height: 6px; border-radius: 50%; background: var(--red); flex: none; }
.preview-bar { background: var(--ink); color: #fff; }
.preview-bar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; font-size: 14px; }
.preview-bar strong { font-weight: 600; }
.preview-bar .btn { margin-left: auto; }

/* ---------- page ---------- */
main .wrap { padding-block: 28px 64px; display: grid; gap: 24px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head > div { display: grid; gap: 4px; min-width: 0; }
.back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; margin-bottom: 6px; }
.back:hover { color: var(--ink); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.panel-head > div { display: grid; gap: 2px; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 24px; }

/* metrics */
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
.metric { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; text-align: left; min-width: 0; align-content: start; }
.metric b { font-size: 26px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
.metric span { color: var(--muted); font-size: 13px; }
button.metric { cursor: pointer; font: inherit; color: inherit; }
button.metric:hover { border-color: var(--ink); }
.metric.attention { border-color: var(--red); }
.metric.attention b { color: var(--red-ink); }
.metric .go { font-size: 12.5px; font-weight: 600; color: var(--ink); display: inline-flex; gap: 4px; align-items: center; margin-top: 4px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; line-height: 1; border: 1px solid transparent; border-radius: var(--r); cursor: pointer; text-decoration: none; white-space: nowrap; transition: background 120ms, border-color 120ms, color 120ms; }
.btn-lg { padding: 13px 20px; font-size: 15px; }
.btn-md { padding: 10px 14px; font-size: 14px; }
.btn-sm { padding: 7px 10px; font-size: 13px; border-radius: var(--r-sm); }
.btn-primary { background: var(--ink); color: #fff; }
.btn-primary:hover { background: var(--ink-hover); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn-secondary:hover { border-color: var(--ink); }
.btn-ghost { background: transparent; color: var(--ink); }
.btn-ghost:hover { background: var(--info-tint); }
.btn-danger { background: var(--surface); color: var(--err); border-color: var(--line-strong); }
.btn-danger:hover { border-color: var(--err); }
.btn-danger.armed { background: var(--err); color: #fff; border-color: var(--err); }
.btn-on-dark { background: #fff; color: var(--ink); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
label.btn:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
label.btn[aria-disabled="true"] { opacity: .4; pointer-events: none; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }

/* ---------- forms ---------- */
.form { display: grid; gap: 16px; }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px 16px; }
.fields.two { grid-template-columns: repeat(2, minmax(0,1fr)); }
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.field > span:first-child, .field legend { font-size: 13px; font-weight: 600; }
.req { color: var(--red-ink); }
.help { font-size: 12.5px; color: var(--muted); }
.error-text { font-size: 12.5px; color: var(--err); font-weight: 600; display: flex; gap: 6px; align-items: center; }
input[type=text], input[type=email], input[type=date], input[type=number], input[type=password], input[type=search], select, textarea {
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 9px 11px; font-size: 15px; width: 100%; min-width: 0; color: var(--ink); }
textarea { resize: vertical; line-height: 1.5; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 0; border-color: var(--ink); }
[aria-invalid="true"] { border-color: var(--err) !important; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
input[type=checkbox], input[type=radio] { accent-color: var(--ink); width: 16px; height: 16px; }
input[type=range] { accent-color: var(--ink); width: 100%; }
.check { display: flex; gap: 10px; align-items: center; font-size: 14px; }
details.group { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); }
details.group > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary .icon { transition: transform 150ms; margin-left: auto; color: var(--muted); }
details.group[open] > summary .icon { transform: rotate(180deg); }
details.group > summary small { font-weight: 500; color: var(--muted); font-size: 12.5px; }
details.group > .group-body { padding: 4px 14px 16px; display: grid; gap: 14px; }

.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--r); padding: 22px 16px; text-align: center; cursor: pointer; display: grid; gap: 4px; justify-items: center; background: var(--surface-2); transition: border-color 120ms, background 120ms; position: relative; }
.drop:hover, .drop.over { border-color: var(--ink); background: var(--surface); }
.drop:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.drop .icon { width: 24px; height: 24px; color: var(--muted); }
.drop strong { font-weight: 600; }
.drop small { color: var(--muted); font-size: 13px; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop.compact { padding: 14px; grid-auto-flow: column; justify-content: center; align-items: center; gap: 10px; }

/* ---------- route choice + stepper ---------- */
.choice { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; border: 0; padding: 0; margin: 0; }
.choice label { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 14px 16px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); cursor: pointer; }
.choice label:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.choice label:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.choice input { margin-top: 3px; grid-row: span 2; }
.choice strong { font-weight: 600; }
.choice small { color: var(--muted); font-size: 13px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 0; list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.steps li { min-width: 0; }
.steps li + li { border-left: 1px solid var(--line); }
.steps button { width: 100%; background: none; border: 0; padding: 12px 16px; display: flex; gap: 10px; align-items: center; text-align: left; font-weight: 600; font-size: 14px; color: var(--muted); cursor: default; }
.steps button.done { cursor: pointer; color: var(--ink); }
.steps button.done:hover { background: var(--surface-2); }
.steps .n { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: 12px; flex: none; font-variant-numeric: tabular-nums; }
.steps [aria-current="step"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--red); }
.steps [aria-current="step"] .n { background: var(--ink); border-color: var(--ink); color: #fff; }
.steps .done .n { background: var(--surface); border-color: var(--ink); color: var(--ink); }
.steps .label-sub { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }

.split { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.sticky { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); }
.preview-box { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); overflow: hidden; display: grid; }
.preview-box canvas, .preview-box img { width: 100%; height: auto; display: block; }
.preview-box .placeholder { aspect-ratio: 1.414 / 1; display: grid; place-items: center; color: var(--muted); font-size: 13px; padding: 16px; text-align: center; max-width: 100%; }
.only-mobile { display: none; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td .sub { display: block; color: var(--muted); font-size: 12.5px; }
td.actions { text-align: right; white-space: nowrap; }
td.actions .row { justify-content: flex-end; flex-wrap: nowrap; }
tr.open > td { background: var(--surface-2); }
tr.detail > td { background: var(--surface-2); padding: 0 14px 16px; }
.truncate { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scroll-y { max-height: 420px; overflow: auto; }
.scroll-y th { position: sticky; top: 0; z-index: 1; }

/* ---------- status ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.chip.ok { background: var(--ok-tint); color: var(--ok); }
.chip.warn { background: var(--warn-tint); color: var(--warn); }
.chip.err { background: var(--err-tint); color: var(--err); }
.chip.neutral { background: var(--info-tint); color: var(--muted); }
.chip.new { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.counts { display: flex; gap: 8px; flex-wrap: wrap; }
.msg { border-radius: var(--r); padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; border: 1px solid; }
.msg > .icon { margin-top: 3px; }
.msg > div { display: grid; gap: 4px; min-width: 0; }
.msg.info { background: var(--surface-2); border-color: var(--line); }
.msg.info > .icon { color: var(--muted); }
.msg.ok { background: var(--ok-tint); border-color: #B7DFC3; }
.msg.ok > .icon { color: var(--ok); }
.msg.warn { background: var(--warn-tint); border-color: #F3D19E; }
.msg.warn > .icon { color: var(--warn); }
.msg.err { background: var(--err-tint); border-color: #F3B8B3; }
.msg.err > .icon { color: var(--err); }
.msg ul { margin: 4px 0 0; padding-left: 18px; }
.empty { color: var(--muted); font-size: 14px; padding: 28px 16px; text-align: center; border: 1px dashed var(--line-strong); border-radius: var(--r); display: grid; gap: 10px; justify-items: center; background: var(--surface); }
.empty strong { color: var(--ink); font-weight: 600; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ink); width: 0; transition: width 200ms; }

/* review summary */
.summary { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.summary > div { padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.summary > div + div { border-left: 1px solid var(--line); }
.summary b { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
.summary span { font-size: 13px; color: var(--muted); }
.summary .lead b { color: var(--ink); }
.dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 20px; font-size: 14px; margin: 0; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; font-weight: 600; min-width: 0; }

/* ---------- adviser portal ---------- */
.figures { display: flex; gap: 12px; flex-wrap: wrap; }
.figure { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 18px; min-width: 170px; }
.figure b { display: block; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
.figure span { color: var(--muted); font-size: 13px; }
.stack td:first-child { min-width: 220px; }
.cert-title { font-weight: 600; }
.auth { max-width: 420px; margin: 48px auto; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 28px; display: grid; gap: 18px; }
.auth .brand svg { width: 26px; height: 29px; }

/* ---------- modal + toast ---------- */
.modal { position: fixed; inset: 0; background: rgba(17,17,17,.55); display: grid; place-items: center; z-index: 50; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal-inner { background: var(--surface); border-radius: var(--r); max-width: 940px; width: 100%; max-height: 100%; overflow: auto; display: grid; gap: 14px; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal canvas, .modal img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: var(--r-sm); display: block; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #fff; padding: 11px 16px; border-radius: var(--r); font-size: 14px; z-index: 60; box-shadow: 0 8px 30px rgba(0,0,0,.25); max-width: calc(100% - 32px); display: flex; gap: 8px; align-items: center; }

/* ---------- insights ---------- */
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.chart-scroll { overflow-x: auto; position: relative; padding-top: 4px; }
.chart { display: block; font-family: var(--font); }
.chart .ch-grid { stroke: var(--line); stroke-width: 1; }
.chart .ch-y, .chart .ch-x2 { fill: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .ch-x { fill: var(--muted); font-size: 11px; }
.chart .ch-val { fill: var(--ink); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chart g.bar { outline: none; }
.chart g.bar:hover path, .chart g.bar:hover rect:not([fill=transparent]), .chart g.bar:focus path, .chart g.bar:focus rect:not([fill=transparent]) { opacity: .82; }
.ch-tip { position: absolute; width: 220px; background: var(--ink); color: #fff; border-radius: var(--r-sm); padding: 8px 10px; font-size: 12px; white-space: pre-line; pointer-events: none; }
.meter-cell { display: flex; align-items: center; gap: 10px; min-width: 150px; }
.meter { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; max-width: 160px; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: 0 3px 3px 0; }
.people-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; padding-top: 12px; }

footer { border-top: 1px solid var(--line); color: var(--faint); font-size: 12px; background: var(--surface); }
footer .wrap { padding-block: 18px; display: grid; gap: 4px; max-width: 1200px; }

@media (max-width: 1000px) {
  .split { grid-template-columns: minmax(0,1fr); }
  .split > .preview-col { display: none; }
  .only-mobile { display: inline-flex; }
}
@media (max-width: 760px) {
  .metrics { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid-2, .choice { grid-template-columns: minmax(0,1fr); }
  .fields, .fields.two { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
  .fields .wide { grid-column: 1 / -1; }
  .summary { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .summary > div:nth-child(3) { border-left: 0; }
  .summary > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .steps .label-sub { display: none; }
  .steps button { padding: 10px; gap: 8px; font-size: 13px; }
  .brand-name span { display: none; }
  .topbar .wrap { gap: 12px; }
  .topbar-end .btn-label { display: none; }
  /* record tables (adviser certificates, sessions) stack into cards */
  .stack thead { display: none; }
  .stack, .stack tbody, .stack tr, .stack td { display: block; }
  .stack tr { padding: 14px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, minmax(0, auto)); justify-content: start; gap: 4px 16px; }
  .stack tr:last-child { border-bottom: 0; }
  .stack td { padding: 0; border: 0; min-width: 0 !important; text-align: left !important; }
  .stack td:first-child { grid-column: 1 / -1; }

async function pdfText(buf) {

  let out = "";

}

// ---------- name matching ----------
function nameVariants(name) {
  const t = normName(name).trim().split(" ").filter(Boolean);
  const v = new Set();
  if (t.length) v.add(t.join(" "));
  if (t.length > 2) v.add(t[0] + " " + t[t.length - 1]);           // drop middle names
  if (t.length >= 2) v.add(t[t.length - 1] + " " + t[0]);           // "Smith, Jane"
  return [...v].filter(x => x.includes(" "));
}
function matchCertificate(text, fileName, advisers) {
  const hay = normText(text), fileHay = normName(fileName.replace(/\.[a-z0-9]+$/i, "").replace(/[_\-]+/g, " "));
  // 1. email printed on certificate
  const byEmail = advisers.filter(a => hay.includes(" " + normEmail(a.email) + " ") || hay.includes(normEmail(a.email)));
  if (byEmail.length === 1) return { status: "matched", adviserId: byEmail[0].id, method: "email", candidates: [] };
  const nameHay = normName(text);
  const scan = (h) => {
    const hits = [];
    for (const a of advisers) for (const v of nameVariants(a.name)) if (h.includes(" " + v + " ")) { hits.push({ a, v }); break; }
    // drop hits whose matched phrase sits inside a longer hit (e.g. "Ann Lee" inside "Mary Ann Lee")
    return hits.filter(h1 => !hits.some(h2 => h2 !== h1 && h2.v.length > h1.v.length && h2.v.includes(h1.v)));
  };
  for (const [h, method] of [[nameHay, "name"], [fileHay, "filename"]]) {
    const hits = scan(h);
    if (hits.length === 1) return { status: "matched", adviserId: hits[0].a.id, method, candidates: [] };
    if (hits.length > 1) return { status: "ambiguous", adviserId: "", method, candidates: hits.map(x => x.a.id) };
  }
  return { status: "unmatched", adviserId: "", method: "", candidates: [] };
}

const PERSONAL_DOMAINS = new Set(["gmail.com","googlemail.com","hotmail.com","hotmail.co.uk","outlook.com","outlook.co.uk","live.com","live.co.uk","msn.com","yahoo.com","yahoo.co.uk","ymail.com","icloud.com","me.com","mac.com","aol.com","aol.co.uk","btinternet.com","btopenworld.com","sky.com","virginmedia.com","ntlworld.com","talktalk.net","tiscali.co.uk","blueyonder.co.uk","protonmail.com","proton.me","gmx.com","gmx.co.uk","mail.com","zoho.com","fastmail.com"]);
const INTERNAL_DOMAINS = new Set(["p1-im.co.uk","ps1.co.uk","ps1capital.co.uk","prydis.com","financialsolutions.co.uk","financialsolutions.com","p1investmentservices.co.uk"]);
const domainOf = (email) => String(email || "").split("@")[1]?.toLowerCase().trim() || "";
const PERIODS = [["all", "All time"], ["12", "Last 12 months"], ["6", "Last 6 months"], ["3", "Last 3 months"]];

function firmKeyOf(a) {
  const d = domainOf(a.email);
  if (INTERNAL_DOMAINS.has(d)) return { key: "internal", internal: true, domain: d };
  if (PERSONAL_DOMAINS.has(d)) {
    const f = (a.firm || "").trim();
    return f ? { key: "name:" + normText(f).trim(), domain: "", personal: true } : { key: "personal", domain: "", personal: true };
  }
  return { key: "domain:" + d, domain: d };
}

function computeInsights() {
  const I = S.ins, advisers = store.advisers(), certs = store.certs();
  const advById = new Map(advisers.map(a => [a.id, a]));
  const saved = new Map(store.sessions().map(x => [x.id, x]));
  const cutoff = I.period === "all" ? "" : (() => { const d = new Date(); d.setMonth(d.getMonth() - Number(I.period)); return d.toISOString().slice(0, 10); })();

  // sessions
  const sessions = new Map();
  for (const c of certs) {
    const a = advById.get(c.adviserId); if (!a) continue;
    const fk = firmKeyOf(a); if (fk.internal && !I.includeInternal) continue;
    const key = c.sessionId && saved.has(c.sessionId) ? c.sessionId : "t:" + (c.eventTitle || "") + "|" + (c.eventDate || "");
    let s = sessions.get(key);
    if (!s) { s = { key, title: c.eventTitle || "Untitled", date: c.eventDate || "", kind: c.eventKind || "", hours: Number(c.cpdHours) || 0, people: new Set() }; sessions.set(key, s); }
    s.people.add(a.id);
  }
  const allSessions = [...sessions.values()].sort((x, y) => (x.date || "").localeCompare(y.date || "") || x.title.localeCompare(y.title));
  // first attendance per adviser across ALL time (so "new" means first ever, even when a period filter is on)
  const firstSeen = new Map(), sessionIndex = new Map(allSessions.map((s, i) => [s.key, i]));
  allSessions.forEach((s, i) => s.people.forEach(id => { if (!firstSeen.has(id)) firstSeen.set(id, i); }));
  allSessions.forEach((s, i) => { s.newCount = [...s.people].filter(id => firstSeen.get(id) === i).length; s.returning = s.people.size - s.newCount; });
  const inPeriod = allSessions.filter(s => !cutoff || (s.date && s.date >= cutoff));
  const periodKeys = new Set(inPeriod.map(s => s.key));

  // people
  const people = new Map();
  for (const s of allSessions) for (const id of s.people) {
    const a = advById.get(id); let p = people.get(id);
    if (!p) { p = { a, fk: firmKeyOf(a), all: [], period: [] }; people.set(id, p); }
    p.all.push(s); if (periodKeys.has(s.key)) p.period.push(s);
  }
  const lastIdx = allSessions.length - 1;
  for (const p of people.values()) {
    p.count = p.period.length; p.total = p.all.length;
    p.first = p.all[0]; p.last = p.all[p.all.length - 1];
    p.sinceLast = lastIdx - sessionIndex.get(p.last.key);
    p.hours = p.period.reduce((t, s) => t + s.hours, 0);
  }
  const active = [...people.values()].filter(p => p.count > 0);

  // firms
  const firms = new Map();
  for (const p of active) {
    let f = firms.get(p.fk.key);
    if (!f) { f = { key: p.fk.key, domain: p.fk.domain, personal: !!p.fk.personal, internal: !!p.fk.internal, names: new Map(), people: [], attendances: 0, sessions: new Set(), last: "" }; firms.set(p.fk.key, f); }
    f.people.push(p); f.attendances += p.count; p.period.forEach(s => f.sessions.add(s.key));
    const fn = (p.a.firm || "").trim(); if (fn) f.names.set(fn, (f.names.get(fn) || 0) + 1);
    const ld = p.period[p.period.length - 1].date || ""; if (ld > f.last) f.last = ld;
  }
  for (const f of firms.values()) {
    const best = [...f.names.entries()].sort((x, y) => y[1] - x[1])[0];
    f.label = f.key === "personal" ? "Personal email addresses" : f.key === "internal" ? "Internal colleagues" : best ? best[0] : f.domain;
    f.people.sort((x, y) => y.count - x.count || x.a.name.localeCompare(y.a.name));
  }
  const firmList = [...firms.values()].sort((x, y) => y.people.length - x.people.length || y.attendances - x.attendances || x.label.localeCompare(y.label));
  const realFirms = firmList.filter(f => f.key !== "personal" && f.key !== "internal");
  const attendances = inPeriod.reduce((t, s) => t + s.people.size, 0);
  return { allSessions, inPeriod, people, active, firmList, realFirms, attendances,
    returningRate: active.length ? active.filter(p => p.count >= 2).length / active.length : 0 };
}

function stackedChart(sessions) {
  if (!sessions.length) return `<div class="empty">No sessions in this period.</div>`;
  // each session gets a slot wide enough for its label; on wide screens slots stretch to fill the panel
  const avail = Math.min(1080, (window.innerWidth || 1200) - 90);
  const slot = Math.max(96, Math.min(180, Math.floor((avail - 50) / sessions.length)));
  const H = 250, padT = 18, padB = 48, padL = 34, bw = Math.min(40, Math.round(slot * 0.36)), gap = slot - bw;
  const W = padL + 12 + sessions.length * slot;
  const max = Math.max(1, ...sessions.map(s => s.people.size));
  const step = max <= 5 ? 1 : max <= 12 ? 2 : max <= 30 ? 5 : max <= 60 ? 10 : Math.ceil(max / 5 / 10) * 10;
  const top = Math.ceil(max / step) * step, y = (v) => padT + (H - padT - padB) * (1 - v / top);
  const ticks = []; for (let v = 0; v <= top; v += step) ticks.push(v);
  const roundTop = (x, y0, w, h, r) => { r = Math.min(r, h, w / 2); return `M${x},${y0 + h}V${y0 + r}Q${x},${y0} ${x + r},${y0}H${x + w - r}Q${x + w},${y0} ${x + w},${y0 + r}V${y0 + h}Z`; };
  const bars = sessions.map((s, i) => {
    const x = padL + 12 + i * slot + (slot - bw) / 2, base = y(0);
    const hRet = base - y(s.returning), hNew = base - y(s.newCount);
    const tip = esc(`${s.title} · ${fmtDate(s.date)}\n${s.people.size} attended: ${s.returning} returning, ${s.newCount} first time`);
    // returning sits on the baseline, new stacks on top with a 2px surface gap; the top segment carries the rounded end
    const retTop = s.newCount === 0;
    const ret = s.returning ? (retTop ? `<path d="${roundTop(x, base - hRet, bw, hRet, 4)}" fill="var(--s-ret)"/>` : `<rect x="${x}" y="${base - hRet}" width="${bw}" height="${hRet}" fill="var(--s-ret)"/>`) : "";
    const gapPx = s.returning ? 2 : 0, nTop = base - hRet - hNew;
    const nw = s.newCount ? `<path d="${roundTop(x, nTop, bw, Math.max(1, hNew - gapPx), 4)}" fill="var(--s-new)"/>` : "";
    const maxCh = Math.floor((slot - 10) / 6.4), label = s.title.length > maxCh ? s.title.slice(0, maxCh - 1).trimEnd() + "…" : s.title;
    return `<g class="bar" data-tip="${tip}" tabindex="0" aria-label="${tip}">
      <rect x="${x - gap / 2}" y="${padT}" width="${bw + gap}" height="${H - padT - padB}" fill="transparent"/>
      ${ret}${nw}
      <text x="${x + bw / 2}" y="${y(s.people.size) - 6}" text-anchor="middle" class="ch-val">${s.people.size}</text>
      <text x="${x + bw / 2}" y="${H - padB + 16}" text-anchor="middle" class="ch-x">${esc(label)}</text>
      <text x="${x + bw / 2}" y="${H - padB + 30}" text-anchor="middle" class="ch-x2">${esc(s.date ? new Date(s.date + "T00:00:00").toLocaleDateString("en-GB", { month: "short", year: "2-digit" }) : "")}</text>
    </g>`;
  }).join("");
  return `<div class="chart-scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Attendance by session, split into returning and first-time attendees">
    ${ticks.map(v => `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" class="ch-grid"/><text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end" class="ch-y">${v}</text>`).join("")}
    ${bars}</svg><div class="ch-tip" hidden></div></div>`;
}

function csvLine(cells) { return cells.map(c => { const v = String(c ?? ""); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; }).join(","); }

function readPeopleCSV(text) {
  const rows = parseCSV(text);
  const out = { people: [], invalid: [], duplicates: [], missingColumns: false };
  if (!rows.length) { out.missingColumns = true; return out; }
  const head = rows[0].map(h => h.toLowerCase().replace(/[^a-z]/g, ""));
  const find = (...keys) => head.findIndex(h => keys.includes(h));
  let iEmail = find("email", "emailaddress", "email1", "attendeeemail", "participantemail", "e");
  let iName = find("name", "fullname", "attendeename", "attendee", "delegatename", "participantname", "displayname");
  const iFirst = find("firstname", "forename", "first", "givenname");
  const iLast = find("lastname", "surname", "last", "familyname");
  const iFirm = find("firm", "company", "companyname", "organisation", "organization", "firmname");
  let body = rows.slice(1), offset = 2;
  if (iEmail < 0 && iName < 0 && iFirst < 0) { body = rows; offset = 1; iEmail = rows[0].findIndex(c => c.includes("@")); iName = rows[0].findIndex((c, i) => i !== iEmail && c); }
  if (iEmail < 0 || (iName < 0 && iFirst < 0)) { out.missingColumns = true; return out; }
  const seen = new Map();
  body.forEach((r, n) => {
    const line = n + offset, raw = (r[iEmail] || "").trim(), email = normEmail(raw);
    const name = (iName >= 0 ? r[iName] : [r[iFirst], r[iLast]].filter(Boolean).join(" ") || "").replace(/\s+/g, " ").trim();
    if (!validEmail(email)) { out.invalid.push({ row: line, text: raw ? `"${raw}" is not a valid email address` : "Email address is missing", name }); return; }
    if (!name) { out.invalid.push({ row: line, text: `No name for ${email}`, name: "" }); return; }
    if (seen.has(email)) { out.duplicates.push({ row: line, email, first: seen.get(email) }); return; }
    seen.set(email, line);
    out.people.push({ email, name, firm: iFirm >= 0 ? (r[iFirm] || "").trim() : "", row: line });
  });
  return out;
}

// every session row: saved sessions, plus older certificates grouped by title and date
function sessionGroups() {
  const certs = store.certs(), saved = store.sessions();
  const rows = saved.map(x => { const mine = certs.filter(c => c.sessionId === x.id); return { key: "s:" + x.id, id: x.id, title: x.title, date: x.date, kind: x.kind, hours: x.hours, cpdType: x.cpdType, certs: mine }; });
  const groups = new Map();
  certs.filter(c => !c.sessionId || !saved.some(x => x.id === c.sessionId)).forEach(c => { const k = "t:" + (c.eventTitle || "") + "|" + (c.eventDate || ""); const g = groups.get(k) || { key: k, id: "", title: c.eventTitle, date: c.eventDate, kind: c.eventKind, hours: c.cpdHours, cpdType: c.cpdType, certs: [] }; g.certs.push(c); groups.set(k, g); });
  return rows.concat([...groups.values()]).map(g => ({ ...g, n: g.certs.length, un: g.certs.filter(c => !c.adviserId).length }))
    .sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
}
// advisers whose only certificates are in this session: removing the session would leave them with nothing
function onlyThisSession(g) {
  const ids = new Set(g.certs.map(c => c.adviserId).filter(Boolean)), inGroup = new Set(g.certs.map(c => c.id));

async function deleteSessionGroup(key) {
  const g = sessionGroups().find(x => x.key === key); if (!g) { S.sessDel = null; render(); return; }
  const orphans = S.sessDel.orphans ? onlyThisSession(g) : [];
  S.sessDel.busy = true; render();
  try {
    await store.deleteSession({ id: g.id, certs: g.certs });
    for (const a of orphans) await store.deleteAdviser(a.id);
    S.sessDel = null; render();
    toast(`Deleted ${g.title}${g.n ? ` and ${plural(g.n, "certificate")}` : ""}${orphans.length ? `, plus ${plural(orphans.length, "account")}` : ""}.`, "ok");
    document.getElementById("h-sessions")?.setAttribute("tabindex", "-1"); document.getElementById("h-sessions")?.focus();
  } catch (e) { S.sessDel.busy = false; render(); toast((e && e.message) || "The session couldn't be deleted. Try again.", "err"); }
}

function backupStatus(kind, text, busy) { S.backup = { kind, text, busy }; const el = document.getElementById("h-backup"); if (el) el.closest("section").outerHTML = backupPanel(); }
async function exportAll() {
  if (!window.JSZip) return toast("Zip support isn't available right now.", "err");
  const certs = store.certs(), sessions = store.sessions(), advisers = store.advisers();
  const zip = new JSZip(); let missing = 0;
  backupStatus("info", `Packing ${plural(certs.length, "certificate")}…`, true);
  for (const [i, c] of certs.entries()) {
    try { zip.file(`files/cert/${c.id}`, await certBlob(c)); } catch (e) { missing++; }
    if (i % 10 === 0) backupStatus("info", `Packing certificates: ${i + 1} of ${certs.length}…`, true);
  }
  for (const x of sessions.filter(x => x.templateFileId)) { try { zip.file(`files/tpl/${x.templateFileId}`, await store.templateBlob(x)); } catch (e) { missing++; } }
  zip.file("data.json", JSON.stringify({ format: "p1-cpd-hub", version: 1, exportedAt: new Date().toISOString(), advisers, sessions, certificates: certs }, null, 1));
  await saveFile(`p1-cpd-hub-backup-${todayISO()}.zip`, await zip.generateAsync({ type: "blob" }));
  backupStatus(missing ? "warn" : "ok", `Exported ${plural(advisers.length, "adviser")}, ${plural(sessions.length, "session")} and ${plural(certs.length, "certificate")}.${missing ? ` ${missing} file${missing === 1 ? "" : "s"} couldn't be read and ${missing === 1 ? "is" : "are"} missing from the backup.` : ""}`, false);
}
async function importBackup(file) {
  try {
    const zip = await JSZip.loadAsync(file), dj = zip.file("data.json");
    if (!dj) throw new Error("This zip isn't a CPD Hub backup (data.json is missing).");
    const D = JSON.parse(await dj.async("string")); if (D.format !== "p1-cpd-hub") throw new Error("This zip isn't a CPD Hub backup.");
    backupStatus("info", "Importing advisers…", true);
    const emailOf = new Map(D.advisers.map(a => [a.id, normEmail(a.email)]));
    const { ids } = await store.importAdvisers(D.advisers.map(a => ({ email: a.email, name: a.name, firm: a.firm || "" })), { noRefresh: true });
    const sessionMap = new Map();
    for (const x of D.sessions) {
      const ex = store.sessions().find(y => y.title === x.title && y.date === x.date);
      if (ex) { sessionMap.set(x.id, ex.id); continue; }
      const body = {}; SESSION_FIELDS.forEach(k => { if (x[k] !== undefined) body[k] = x[k]; }); if (x.source) body.source = x.source; delete body.id;
      if (x.templateFileId) {
        const tf = zip.file(`files/tpl/${x.templateFileId}`);
        if (tf) Object.assign(body, await store.uploadTemplate(new File([await tf.async("blob")], "background", { type: x.templateType || "application/pdf" })));
        else { body.templateFileId = ""; }
      }
      sessionMap.set(x.id, await store.saveSession(body));
    }
    const have = new Set(store.certs().map(c => c.id));
    const todo = D.certificates.filter(c => !have.has(c.id));
    let done = 0, failed = 0;
    for (const c of todo) {
      const f = zip.file(`files/cert/${c.id}`);
      if (!f) { failed++; continue; }
      try {
        const email = emailOf.get(c.adviserId);
        await store.addCertificate(new File([await f.async("blob")], c.fileName || "certificate.pdf", { type: c.contentType || "application/pdf" }), {
          id: c.id, sessionId: sessionMap.get(c.sessionId) || "", adviserId: (email && ids[email]) || "", matchMethod: c.matchMethod || "",
          eventTitle: c.eventTitle, eventDate: c.eventDate || "", cpdHours: Number(c.cpdHours) || 0, eventKind: c.eventKind || "", cpdType: c.cpdType || "" });
        done++;
      } catch (e) { failed++; }
      if (done % 5 === 0) backupStatus("info", `Importing certificates: ${done} of ${todo.length}…`, true);
    }
    if (store.afterBatch) await store.afterBatch();
    backupStatus(failed ? "warn" : "ok", `Imported ${plural(D.advisers.length, "adviser")}, ${plural(D.sessions.length, "session")} and ${plural(done, "certificate")}.${D.certificates.length - todo.length ? ` ${D.certificates.length - todo.length} were already here.` : ""}${failed ? ` ${failed} couldn't be imported; run the import again to retry them.` : ""}`, false);
    render();
  } catch (e) { backupStatus("err", e.message || "The backup couldn't be imported.", false); }
}

function openModal(title, sub, actionsHtml, fill) {

      case "issue-new": startFlow(null); break;
      case "issue-more": { const st = sessionById(id); if (st) startFlow(st, 2); break; }
      case "sess-del": { const k = t.dataset.key; S.sessDel = S.sessDel && S.sessDel.key === k ? null : { key: k, orphans: true, busy: false }; render(); document.querySelector('[data-action="sess-del-confirm"]')?.focus(); break; }
      case "sess-del-cancel": { const k = S.sessDel && S.sessDel.key; S.sessDel = null; render(); document.querySelector(`[data-action="sess-del"][data-key="${CSS.escape(k || "")}"]`)?.focus(); break; }
      case "sess-del-confirm": await deleteSessionGroup(t.dataset.key); break;
      case "step": { const n = +t.dataset.n; if (n < S.flow.step) setStep(n); break; }
      case "next": {
        const F = S.flow;
        if (F.step === 1) { if (!validateSession()) { render(); focusFirstError(); announce("Check the highlighted fields."); return; } setStep(2); }
        else if (F.step === 2) setStep(3);
        break;
      }
      case "preview-modal": openModal("Certificate preview", S.flow.session.title || "", "", (body) => { body.innerHTML = `<div class="preview-box" id="cert-preview-modal">${previewPlaceholder()}</div>`; attachPreview(); }); break;
      case "issue": await issueNow(); break;
      case "zip-result": await downloadZip(store.certs().filter(c => S.flow.result.certIds.includes(c.id)), safeFile(`CPD certificates - ${S.flow.result.title}`) + ".zip", true); break;
      case "up-remove": S.flow.uploads = S.flow.uploads.filter(r => r.key !== t.dataset.key); S.flow.uploads.forEach(flagUploadDuplicate); render(); break;
      case "csv-template": await saveFile("cpd-attendees-template.csv", new Blob(["email,name,firm\njane.smith@example-advice.co.uk,Jane Smith,Example Advice Ltd\n"], { type: "text/csv" })); break;
      case "assign": {
        const sel = document.getElementById("as-" + id);
        if (!sel || !sel.value) { toast("Choose an adviser first.", "err"); sel && sel.focus(); return; }
        const who = adviserById().get(sel.value); await store.assign(id, sel.value);
        toast(`Assigned to ${who ? who.name : "adviser"}.`, "ok"); render();
        const next = document.querySelector('[id^="as-"]'); (next || document.querySelector("main h1"))?.focus(); break;
      }
      case "delete": {
        const key = t.dataset.kind + ":" + id;
        if (S.armed !== key) { S.armed = key; render(); document.querySelector(`[data-action="delete"][data-id="${id}"]`)?.focus(); return; }
        S.armed = null;
        if (t.dataset.kind === "cert") { await store.deleteCertificate(findCert(id)); toast("Certificate deleted.", "ok"); }
        else { await store.deleteAdviser(id); S.dir.open = null; toast("Adviser deleted.", "ok"); }
        render(); break;
      }
      case "preview": openCertPreview(id); break;
      case "download": await downloadOne(id); break;
      case "dir-open": S.dir.open = S.dir.open === id ? null : id; render(); break;
      case "dir-import": S.dir.importing = !S.dir.importing; S.dir.csv = null; render(); break;
      case "dir-cancel": S.dir.importing = false; S.dir.csv = null; render(); break;
      case "dir-save": { t.disabled = true; const r = await store.importAdvisers(S.dir.csv.people); S.dir.importing = false; S.dir.csv = null; render(); toast(`Imported: ${r.added} new, ${r.updated} updated.`, "ok"); break; }
      case "zip-adviser": { const ad = adviserById().get(id); await downloadZip(store.certs().filter(c => c.adviserId === id), safeFile(`CPD certificates - ${ad.name}`) + ".zip", false); break; }
      case "backup-export": await exportAll(); break;
      case "zip-all": await downloadZip(store.certs().filter(c => c.adviserId), `CPD certificates - all advisers - ${todayISO()}.zip`, true); break;
      case "zip-mine": await downloadZip(S.adviserCerts, safeFile(`CPD certificates - ${S.adviser.name}`) + ".zip", false); break;
      case "preview-as": previewAs(adviserById().get(id)); break;
      case "preview-portal": previewAs(null); break;
      case "end-preview": S.previewing = false; S.adviser = null; S.adviserCerts = []; go(S.route); break;
      case "logout": await store.logout(); S.adviser = null; S.adviserCerts = []; S.login = { step: "email", email: "", error: "", busy: false }; render(); break;
      case "login-back": S.login.step = "email"; S.login.error = ""; render(); break;
      case "ins-firm": S.ins.firmOpen = S.ins.firmOpen === id ? null : id; render(); break;
      case "ins-all-firms": S.ins.showAllFirms = !S.ins.showAllFirms; render(); break;
      case "ins-export-firms": await exportInsights("firms"); break;
      case "ins-export-people": await exportInsights("people"); break;
    }
  } catch (err) { toast(err.message || "Something went wrong. Try again.", "err"); render(); }
});
document.addEventListener("change", async (e) => {
  const t = e.target, F = S.flow;
  if (t.id === "att-input") { const f = t.files[0]; t.value = ""; return handleAttendeeCSV(f); }
  if (t.id === "cert-input") { const f = [...t.files]; t.value = ""; return handleUploads(f); }
  if (t.id === "backup-input") { const f = t.files[0]; t.value = ""; if (f) await importBackup(f); return; }
  if (t.id === "dir-input") { const f = t.files[0]; t.value = ""; if (f) { S.dir.csv = { fileName: f.name, ...readPeopleCSV(await f.text()) }; render(); } return; }
  if (t.id === "tpl-input") { const f = t.files[0]; t.value = ""; if (f) { F.templateFile = f; delete F.errors.template; render(); schedulePreview(0); } return; }
  if (t.dataset.action === "mode") { F.mode = t.value; F.errors = {}; render(); schedulePreview(0); return; }
  if (t.dataset.sbind) {
    F.session[t.dataset.sbind] = t.type === "checkbox" ? t.checked : t.value;
    clearFieldError(t.dataset.sbind, t);
    if (t.tagName === "SELECT" && t.dataset.sbind === "theme") render();
    schedulePreview(); return;
  }
  if (t.dataset.action === "del-orphans") { if (S.sessDel) S.sessDel.orphans = t.checked; return; }
  if (t.dataset.action === "att-inc") { const rows = S.flow.attendees.people; rows[+t.dataset.i].include = t.checked; render(); return; }
  if (t.dataset.action === "att-all") { S.flow.attendees.people.forEach(r => r.include = t.checked); render(); return; }
  if (t.dataset.action === "up-inc") { const r = F.uploads.find(x => x.key === t.dataset.key); if (r) r.include = t.checked; render(); return; }
  if (t.dataset.action === "up-assign") { const r = F.uploads.find(x => x.key === t.dataset.key); if (r) { r.adviserId = t.value; r.method = t.value ? "manual" : ""; r.status = t.value ? "matched" : "unmatched"; r.include = true; r.note = t.value ? "" : "Will go to the assignment queue"; F.uploads.forEach(flagUploadDuplicate); } render(); return; }
  if (t.dataset.action === "move") { try { await store.assign(t.dataset.id, t.value); const who = adviserById().get(t.value); toast(who ? `Moved to ${who.name}.` : "Moved to the assignment queue.", "ok"); } catch (err) { toast(err.message, "err"); } render(); return; }
  if (t.dataset.ins) { S.ins[t.dataset.ins] = t.type === "checkbox" ? t.checked : t.value; if (t.dataset.ins !== "session") S.ins.firmOpen = null; render(); return; }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.action === "search") { S.dir.search = t.value; render(); return; }
  if (t.dataset.sbind && t.type !== "checkbox" && t.tagName !== "SELECT") {
    S.flow.session[t.dataset.sbind] = t.value; schedulePreview(); if (t.value) clearFieldError(t.dataset.sbind, t);
    if (t.type === "range") { const v = $("#pos-val"); if (v) v.textContent = t.value; }
  }
});
document.addEventListener("submit", async (e) => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  const L = S.login;
  try {
    if (f === "admin-login") { S.adminLoginError = ""; await store.adminLogin($("#admin-pw").value); S.isAdmin = true; go("overview"); return; }
    if (f === "adviser-login") {
      L.email = normEmail($("#login-email").value); L.error = "";
      if (!validEmail(L.email)) { L.error = "Enter a valid email address, like name@yourfirm.co.uk."; render(); $("#login-email").focus(); return; }
      if (S.previewing) { // preview never touches the real adviser sign-in
        const a = store.advisers().find(x => normEmail(x.email) === L.email);
        if (!a) { L.error = "No adviser account uses that email. Check the spelling, or import them from the Advisers tab."; render(); $("#login-email").focus(); return; }
        previewAs(a); return;
      }
      L.busy = true; render();
      const r = await store.login(L.email); L.busy = false;
      if (r.codeSent) { L.step = "code"; render(); $("#login-code").focus(); return; }
      S.adviser = r.adviser; S.adviserCerts = await store.myCertificates(r.adviser); render(); $("main h1")?.focus(); return;
    }
    if (f === "adviser-code") {
      L.busy = true; L.error = ""; render();
      const r = await store.verify(L.email, $("#login-code").value.trim());
      L.busy = false; S.adviser = r.adviser; S.adviserCerts = await store.myCertificates(r.adviser); render(); return;
    }
  } catch (err) {
    if (f === "admin-login") { S.adminLoginError = err.message; render(); $("#admin-pw").focus(); return; }
    L.busy = false; L.error = err.message; render(); (document.getElementById(f === "adviser-code" ? "login-code" : "login-email"))?.focus();
  }
});
["dragover", "dragleave", "drop"].forEach(ev => document.addEventListener(ev, (e) => {
  const z = e.target.closest && e.target.closest("[data-drop]"); if (!z) return;
  e.preventDefault();
  if (ev === "dragover") z.classList.add("over"); else z.classList.remove("over");
  if (ev !== "drop") return;
  const files = e.dataTransfer.files, k = z.dataset.drop;
  if (k === "att") handleAttendeeCSV(files[0]);
  else if (k === "certs") handleUploads(files);
  else if (k === "dir" && files[0]) files[0].text().then(tx => { S.dir.csv = { fileName: files[0].name, ...readPeopleCSV(tx) }; render(); });
  else if (k === "tpl" && files[0]) { S.flow.templateFile = files[0]; render(); schedulePreview(0); }
}));
// chart tooltips
function showTip(g) {
  const wrap = g.closest(".chart-scroll"), tip = wrap && wrap.querySelector(".ch-tip"); if (!tip) return;
  tip.textContent = g.dataset.tip; tip.hidden = false;
  const r = g.getBoundingClientRect(), w = wrap.getBoundingClientRect();
  tip.style.left = Math.min(Math.max(8, r.left - w.left + wrap.scrollLeft + r.width / 2 - 110), wrap.scrollWidth - 228) + "px"; tip.style.top = "6px";
}
function hideTip(g) { const tip = g.closest(".chart-scroll")?.querySelector(".ch-tip"); if (tip) tip.hidden = true; }
document.addEventListener("mouseover", e => { const g = e.target.closest && e.target.closest("g.bar"); if (g) showTip(g); });
document.addEventListener("mouseout", e => { const g = e.target.closest && e.target.closest("g.bar"); if (g && !g.contains(e.relatedTarget)) hideTip(g); });
document.addEventListener("focusin", e => { const g = e.target.closest && e.target.closest("g.bar"); if (g) showTip(g); });
document.addEventListener("focusout", e => { const g = e.target.closest && e.target.closest("g.bar"); if (g) hideTip(g); });

// ---------- boot ----------
(async () => {
  if (HUB_MODE === "server") S.view = location.hash === "#admin" ? "admin" : "adviser";
  render();
  try {
    const r = await store.init((evt) => {
      if (evt.error) { S.boot = "error"; S.bootError = evt.error; }
      if (evt.slow && !store.loaded()) toast("Storage is slow to respond. Records will appear when it answers.");
      if (S.previewing && S.adviser) { const a = store.advisers().find(x => x.id === S.adviser.id); if (a) { S.adviser = a; S.adviserCerts = store.certs().filter(c => c.adviserId === a.id); } }
      if (!S.flow.issuing) render();
    });
    if (r.error) { S.boot = "error"; S.bootError = r.error; }
    else {
      S.boot = "ready"; S.isAdmin = !!r.admin; S.canUpload = !!r.canUpload;
      if (r.adviser) { S.adviser = r.adviser; S.adviserCerts = await store.myCertificates(r.adviser); S.view = "adviser"; }
      if (HUB_MODE === "server" && r.admin) S.view = "admin";
    }
  } catch (e) { S.boot = "error"; S.bootError = e.message || "The hub could not start."; }
  render();
})();
window.addEventListener("hashchange", () => { if (HUB_MODE === "server" && location.hash === "#admin") { S.view = "admin"; render(); } });

})();
</script>
